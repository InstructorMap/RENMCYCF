<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="Content-Security-Policy" content="style-src 'unsafe-inline' https://www.gstatic.com; img-src * data:; script-src 'unsafe-inline' https:; connect-src *;">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Comando · RENMCYCF</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Corrección: Credenciales reales integradas desde login
        const PROJECT_URL = 'https://hiirhuohxpzsphlduypo.supabase.co';
        const PUBLIC_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhpaXJodW9oeHB6c3BobGR1eXBvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyOTgyMTAsImV4cCI6MjA5OTg3NDIxMH0.qvEaRyo0vbnaW9hiX4bXhtRdMkW7n9mDMrApKBRmbhE';
        const db = window.supabase.createClient(PROJECT_URL, PUBLIC_KEY);

        async function verificarSesionAdmin() {
            const { data: { session } } = await db.auth.getSession();
            
            if (!session) {
                window.location.href = 'login.renmcycf.html'; // Corregido al nombre real del archivo
                return;
            }

            // Validar si realmente es admin
            const { data: roleData } = await db
                .from('renmcycf_roles')
                .select('rol')
                .eq('user_id', session.user.id)
                .single();

            if (!roleData || (roleData.rol !== 'admin' && roleData.rol !== 'auditor')) {
                alert('Acceso no autorizado.');
                window.location.href = 'wallet.renmcycf.html'; // Corregido al nombre real del archivo
            }
        }

        verificarSesionAdmin();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Montserrat:wght@700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --neon-blue: #3b82f6; --neon-gold: #fbbf24; --glass-bg: rgba(15, 23, 42, 0.6); --glass-border: rgba(255, 255, 255, 0.08); }
        body { font-family: 'Outfit', sans-serif; background-color: #030712; color: #e2e8f0; background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.10) 0%, transparent 50%), radial-gradient(circle at 85% 30%, rgba(217, 119, 6, 0.05) 0%, transparent 50%); background-attachment: fixed; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: var(--glass-bg); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 16px; }
        .glass-card { background: rgba(30, 41, 59, 0.4); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid var(--glass-border); border-radius: 12px; transition: all 0.3s ease; }
        .glass-card:hover { border-color: rgba(255,255,255,0.15); }
        .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; transition: all 0.3s; color: #94a3b8; cursor: pointer; }
        .sidebar-link:hover { color: white; background: rgba(255,255,255,0.05); }
        .sidebar-link.active { color: var(--neon-gold); background: rgba(217, 119, 6, 0.1); border-left: 3px solid var(--neon-gold); }
        input[type="text"], input[type="number"], input[type="email"], input[type="url"], input[type="color"], select, textarea { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 8px; padding: 10px 12px; color: white; outline: none; transition: all 0.3s; font-size: 0.85rem; }
        input:focus, select:focus, textarea:focus { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        label { display: block; font-size: 0.65rem; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        th { background: rgba(0,0,0,0.4); text-transform: uppercase; font-size: 0.7rem; letter-spacing: 1px; }
        tr { border-bottom: 1px solid var(--glass-border); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #020617; } ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- SIDEBAR DE NAVEGACIÓN -->
    <aside class="w-64 glass-panel m-4 mr-0 flex flex-col z-20 hidden md:flex border-r border-white/5">
        <div class="h-28 flex flex-col justify-center px-6 border-b border-white/5 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-yellow-500"></div>
            <div class="flex items-center gap-2 text-white font-black tracking-widest text-2xl"><i data-lucide="shield-check" class="text-yellow-500"></i> RENMCYCF</div>
            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-1">Centro de Comando</span>
        </div>
        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <div class="px-2 py-2 text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-2">Gestión y Análisis</div>
            <button type="button" onclick="showTab('dashboard')" id="nav-dashboard" class="sidebar-link active w-full"><i data-lucide="pie-chart" class="w-4 h-4"></i> Dashboard Gerencial</button>
            <button type="button" onclick="showTab('solicitudes')" id="nav-solicitudes" class="sidebar-link w-full"><i data-lucide="inbox" class="w-4 h-4"></i> Trámites (CRM)</button>
            <button type="button" onclick="showTab('padron')" id="nav-padron" class="sidebar-link w-full"><i data-lucide="database" class="w-4 h-4"></i> Padrón Oficial</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 relative">
        <header class="h-20 flex justify-between items-center px-8 z-10 border-b border-white/5 bg-black/20">
            <h2 class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400" id="page-title">Dashboard Gerencial</h2>
            <div class="flex items-center gap-4">
                <span class="text-xs font-bold text-yellow-500 bg-yellow-500/10 px-3 py-1 rounded-lg uppercase tracking-wider" id="header-user-role">Conectado</span>
                <button type="button" onclick="db.auth.signOut().then(() => window.location.href = 'login.renmcycf.html')" class="text-slate-400 hover:text-red-400 transition-colors flex items-center gap-2 border border-slate-700/50 hover:border-red-500/50 px-3 py-1.5 rounded-lg"><span class="text-xs font-bold hidden md:inline">SALIR</span><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 md:p-8 z-10">
            <div id="view-dashboard" class="tab-content active space-y-6">
                <div class="glass-card p-6">
                    <h3 class="text-white font-bold text-lg mb-2">Panel de Control Inicializado Correctamente</h3>
                    <p class="text-xs text-slate-400">Las credenciales de Supabase y las rutas de navegación han sido sincronizadas.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');
        }
    </script>
</body>
</html>
